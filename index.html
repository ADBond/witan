<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Play Witan Online - in development</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="/src/main.ts" defer></script>
    <meta name="description" content="Play Witan Online is a place to play
        the trick-taking card game Witan against bot players
        in-browser.">
</head>

<body>
    <div id="new-game-button">New game</div>
    <div id="new-game-menu" hidden>
        <form id="new-game-form">
            <fieldset>
                <legend>Num. players</legend>
                <input type="radio" name="numplayers" value="3" id="numplayers-3">
                <label for="numplayers-3">3</label>

                <input type="radio" name="numplayers" value="4" id="numplayers-4">
                <label for="numplayers-4">4</label>
            </fieldset>
            
            <fieldset>
                <legend>Target Score</legend>
                <input type="radio" name="targetscore" value="301" id="targetscore-301">
                <label for="targetscore-301">301</label>
                <input type="radio" name="targetscore" value="601" id="targetscore-601">
                <label for="targetscore-601">601</label>
                <input type="radio" name="targetscore" value="901" id="targetscore-901">
                <label for="targetscore-901">901</label>
            </fieldset>

            <button type="submit" id="play-now">Play Now</button>
        </form>
    </div>

    <div class="config" id="config"></div>
    <div class="hand-number" id="hand-number"></div>

    <div class="scores-panel">
        <table id="scores-table">
            <thead>
                <tr id="scores-headers">
                </tr>
            </thead>
            <tbody>
                <tr id="scores-current"></tr>
                <tr id="scores-previous"></tr>
            </tbody>
        </table>
    </div>

    <div class="game-board" id="game-board">
    </div>

    <div class="previous-trick">
        <div class="prev-area" id="prev-area"></div>
    </div>

    <div id="trumps"></div>

    <div class="hand">
        <div id="player-hand"></div>
    </div>

</body>

</html>
